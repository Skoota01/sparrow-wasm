[package]
name = "sparrow-web"
version = "0.1.0"
edition = "2024"
description = "Browser (WebAssembly) wrapper around the Sparrow nesting heuristic"

[lib]
crate-type = ["cdylib"]

[dependencies]
sparrow = { path = "../sparrow" }
jagua-rs = { features = ["spp"], version = "=1.1.0" }
rand = "0.10"
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
